<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eVerify | Clara</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="login-page">
    <div class="login-card" id="login-step">
        <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="var(--color-brand)"/>
                <path d="M2 17L12 22L22 17" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 12L12 17L22 12" stroke="var(--color-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2>Secure Login</h2>
        <p class="text-muted mb-3">Verify your identity securely with EU eVerify</p>
        
        <div style="text-align: left; margin-bottom: 1.5rem;">
            <label class="text-muted" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Select Country</label>
            <select class="login-input">
                <option>🇪🇺 Any EU Country (eVerify)</option>
                <option>🇱🇻 Latvia</option>
                <option>🇪🇪 Estonia</option>
                <option>🇱🇹 Lithuania</option>
            </select>
            
            <label class="text-muted" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Personal Number</label>
            <input type="text" id="personal-number" class="login-input" placeholder="e.g. 370101-10001">
            <div style="margin-top: -5px; margin-bottom: 20px;">
                <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 8px;">Quick Demo Accounts:</p>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="fillDemo('370101-10001')">👩 Marta (Young Pro)</button>
                    <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="fillDemo('370101-20002')">👨 Andris (Mid-Career)</button>
                    <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="fillDemo('370101-30003')">👵 Ingrid (Pre-Retirement)</button>
                </div>
            </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; padding: 14px;" onclick="startLogin()">Verify Identity</button>
    </div>

    <div class="login-card hidden" id="waiting-step">
        <h2>Check your phone</h2>
        <p class="text-muted mb-2">Open the eVerify app to confirm your identity.</p>
        <h1 style="color: var(--color-accent-blue); letter-spacing: 4px; margin: 2rem 0;">4829</h1>
        <div class="spinner"></div>
    </div>
</div>

<script src="assets/js/data.js"></script>
<script>
    function fillDemo(id) {
        document.getElementById('personal-number').value = id;
        startLogin();
    }

    function startLogin() {
        const idInput = document.getElementById('personal-number').value.trim();
        if (!idInput) {
            alert('Please enter a personal number (e.g. 370101-10001)');
            return;
        }

        if (setPersona(idInput)) {
            document.getElementById('login-step').classList.add('hidden');
            document.getElementById('waiting-step').classList.remove('hidden');
            
            // Simulate waiting for phone confirmation
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2500);
        } else {
            alert('Unknown personal number. Please use one of the demo users.');
        }
    }
</script>

</body>
</html>
